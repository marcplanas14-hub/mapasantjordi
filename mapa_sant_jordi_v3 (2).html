    animation: fadeUpT .25s ease;

  @keyframes fadeUpT {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }

<div class="header">
  <div class="header-left">

    </div>
  </div>
  <div class="header-stats">

      <span class="lbl">empreses</span>
    </div>
    <div class="stat-badge">
      <span class="num" id="s-roses">—</span>
      <span class="lbl">roses total</span>
    </div>
    <div class="stat-badge">
      <span class="num">22–23</span>
      <span class="lbl">d'abril</span>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn-filter on-all" id="fb-all" onclick="setFilter('all')">
    🌹 Totes les empreses
  </button>
  <div class="sep"></div>
  <button class="btn-filter" id="fb-22" onclick="setFilter('22')">
    <span class="legend-dot" style="background:#E74C3C"></span>
    22 d'abril · <b id="c22">—</b>
  </button>
  <button class="btn-filter" id="fb-23" onclick="setFilter('23')">
    <span class="legend-dot" style="background:#8E44AD"></span>
    23 d'abril · <b id="c23">—</b>
  </button>
  <button class="btn-filter" id="fb-lib" onclick="setFilter('lib')">
    <span class="legend-dot" style="background:#3498DB"></span>
    Liberty · <b id="clib">—</b>
  </button>
  <div class="sep"></div>
  <div class="controls-right">Roses visibles: <b id="vis-ros">—</b></div>
</div>

<div class="body-wrap">
  <div id="map"></div>

  <div class="sidebar">
    <div class="sidebar-header">📋 Empreses</div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="🔍 Buscar empresa..." oninput="renderList(this.value)">
    </div>
    <div class="company-list" id="companyList"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="editModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>✏️ Editar empresa</h2>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fld"><label>Nom de l'empresa</label><input id="eEmpresa" type="text"></div>
      <div class="fld"><label>Adreça d'entrega</label><input id="eAdresa" type="text"></div>
      <div class="fld-row">
        <div class="fld">
          <label>🌹 Roses</label>
          <input id="eRoses" type="number" min="0">
        </div>
        <div class="fld">
          <label>📅 Dia entrega</label>
          <select id="eDia">
            <option value="22">22 d'abril</option>
            <option value="23">23 d'abril</option>
            <option value="—">Pendent</option>
          </select>
        </div>
      </div>
      <div class="fld"><label>🕐 Hora entrega</label><input id="eHora" type="text" placeholder="Ej: 10-12h, De 15 a 17h..."></div>
      <div class="fld"><label>📝 Notes</label><input id="eNotes" type="text" placeholder="Observacions..."></div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel-m" onclick="closeModal()">Cancel·lar</button>
      <button class="btn-save-m" onclick="saveEdit()">💾 Desar canvis</button>
    </div>
  </div>
</div>

];

let currentFilter = 'all';
let markers = {};
let activeMarkerId = null;
let editingId = null;
let map;

// ═══ MAP INIT ═══
map = L.map('map', {
  center: [41.3900, 2.1500],
  zoom: 13,
  zoomControl: true
});

L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  attribution: '© Google Maps',
  maxZoom: 20,
  subdomains: ['mt0','mt1','mt2','mt3']
}).addTo(map);

// ═══ CUSTOM ICON ═══
function makeIcon(dia, active) {
  const color = dia === '22' ? '#E74C3C' : dia === '23' ? '#8E44AD' : dia === 'lib' ? '#3498DB' : '#888';
  const border = active ? '#FFD700' : 'white';
  const size = active ? 38 : 32;
  const html = `
    <div style="
      width:${size}px; height:${size}px;
      background:${color};
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2.5px solid ${border};
      box-shadow:0 3px 10px rgba(0,0,0,0.4);
      display:flex; align-items:center; justify-content:center;
    ">
      <span style="transform:rotate(45deg); font-size:${active?16:13}px">${dia==='lib'?'💐':'🌹'}</span>
    </div>`;
  return L.divIcon({
    className: '',
    html,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -(size+4)]
  });
}

// ═══ BUILD POPUP HTML ═══
function buildPopup(c) {
  const cls = c.dia==='22' ? 'c22' : c.dia==='23' ? 'c23' : 'cpend';
  const diaText = c.dia==='22' ? '22 d\'abril' : c.dia==='23' ? '23 d\'abril' : 'Pendent';
  const notesHtml = c.notes
    ? `<div class="popup-row"><span class="icon">📝</span><span>${c.notes}</span></div>`
    : '';
  return `
    <div class="popup-top ${cls}">
      <div class="popup-empresa">${c.empresa}</div>
    </div>
    <div class="popup-body">
      <div class="popup-row"><span class="icon">📍</span><span>${c.adresa}</span></div>
      <div class="popup-row"><span class="icon">📅</span><span>${diaText}</span></div>
      <div class="popup-row"><span class="icon">🕐</span><span>${c.hora || 'Qualsevol hora'}</span></div>
      <div class="popup-row"><span class="icon">🌹</span><span class="roses-pill">🌹 ${c.roses||'?'} roses</span></div>
      ${notesHtml}
    </div>
    <div class="popup-footer">
      <button class="btn-edit-popup" onclick="openEdit(${c.id})">✏️ Editar informació</button>
    </div>
  `;
}

// ═══ RENDER MARKERS ═══
function renderMarkers() {
  // Remove old
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const filtered = companies.filter(c => currentFilter === 'all' || c.dia === currentFilter);

  filtered.forEach(c => {
    const m = L.marker([c.lat, c.lng], { icon: makeIcon(c.dia, false) })
      .addTo(map)
      .bindPopup(buildPopup(c), {
        maxWidth: 310,
        minWidth: 280,
        closeButton: true,
        autoClose: true
      });

    m.on('click', () => {
      activeMarkerId = c.id;
      highlightSidebarItem(c.id);
    });

    m.on('popupclose', () => {
      if (activeMarkerId === c.id) {
        activeMarkerId = null;
        highlightSidebarItem(null);
      }
    });

    markers[c.id] = m;
  });

  updateStats();
}

function highlightSidebarItem(id) {
  document.querySelectorAll('.ci').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.id) === id);
  });
  if (id !== null) {
    const el = document.querySelector(`.ci[data-id="${id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ═══ SIDEBAR LIST ═══
function renderList(q = '') {
  const sorted = [...companies].sort((a,b) => {
    if (a.dia !== b.dia) return a.dia < b.dia ? -1 : 1;
    return a.empresa.localeCompare(b.empresa);
  });

  const shown = q
    ? sorted.filter(c => c.empresa.toLowerCase().includes(q.toLowerCase()))
    : sorted;

  const col22 = '#E74C3C', col23 = '#8E44AD', colLib = '#3498DB', colP = '#888';

  document.getElementById('companyList').innerHTML = shown.map(c => {
    const col = c.dia==='22' ? col22 : c.dia==='23' ? col23 : c.dia==='lib' ? colLib : colP;
    const diaLbl = c.dia==='22' ? '22 abr' : c.dia==='23' ? '23 abr' : c.dia==='lib' ? '23 matí 💐' : 'Pendent';
    return `
      <div class="ci" data-id="${c.id}" onclick="focusCompany(${c.id})">
        <div class="ci-dot" style="background:${col}"></div>
        <div class="ci-info">
          <div class="ci-name">${c.empresa}</div>
          <div class="ci-meta">📅 ${diaLbl}${c.hora ? ' · 🕐 ' + c.hora : ''}</div>
        </div>
        <div class="ci-roses" style="${c.dia==='lib'?'background:#EBF5FB;color:#1A6FA8;border-color:#AED6F1':''}">${c.dia==='lib'?'💐 Ram':'🌹 '+(c.roses||'?')}</div>
      </div>`;
  }).join('');
}

function focusCompany(id) {
  const c = companies.find(x => x.id === id);
  if (!c) return;
  map.setView([c.lat, c.lng], 16, { animate: true });
  setTimeout(() => {
    const m = markers[id];
    if (m) m.openPopup();
    activeMarkerId = id;
    highlightSidebarItem(id);
  }, 450);
}

// ═══ FILTER ═══
function setFilter(f) {
  currentFilter = f;
  document.getElementById('fb-all').className = 'btn-filter' + (f==='all' ? ' on-all' : '');
  document.getElementById('fb-22').className  = 'btn-filter' + (f==='22'  ? ' on-22'  : '');
  document.getElementById('fb-23').className  = 'btn-filter' + (f==='23'  ? ' on-23'  : '');
  document.getElementById('fb-lib').className = 'btn-filter' + (f==='lib' ? ' on-lib' : '');
  map.closePopup();
  renderMarkers();
}

// ═══ STATS ═══
function updateStats() {
  const filtered = companies.filter(c => currentFilter==='all' || c.dia===currentFilter);
  const total = companies.reduce((s,c) => s + (c.roses||0), 0);
  const vis   = filtered.reduce((s,c) => s + (c.roses||0), 0);
  document.getElementById('s-emp').textContent   = companies.length;
  document.getElementById('s-roses').textContent = total.toLocaleString();
  document.getElementById('vis-ros').textContent  = vis.toLocaleString();
  document.getElementById('c22').textContent = companies.filter(c=>c.dia==='22').length;
  document.getElementById('c23').textContent = companies.filter(c=>c.dia==='23').length;
  document.getElementById('clib').textContent = companies.filter(c=>c.dia==='lib').length;
}

// ═══ EDIT MODAL ═══
function openEdit(id) {
  editingId = id;
  const c = companies.find(x => x.id === id);
  document.getElementById('eEmpresa').value = c.empresa;
  document.getElementById('eAdresa').value  = c.adresa;
  document.getElementById('eRoses').value   = c.roses;
  document.getElementById('eDia').value     = c.dia;
  document.getElementById('eHora').value    = c.hora;
  document.getElementById('eNotes').value   = c.notes;
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

function saveEdit() {
  const c = companies.find(x => x.id === editingId);
  if (!c) return;
  c.empresa = document.getElementById('eEmpresa').value;
  c.adresa  = document.getElementById('eAdresa').value;
  c.roses   = parseInt(document.getElementById('eRoses').value) || 0;
  c.dia     = document.getElementById('eDia').value;
  c.hora    = document.getElementById('eHora').value;
  c.notes   = document.getElementById('eNotes').value;

  // Refresh marker popup
  const m = markers[editingId];
  if (m) {
    m.setPopupContent(buildPopup(c));
    m.setIcon(makeIcon(c.dia, false));
  }

  renderList(document.getElementById('searchInput').value);
  updateStats();
  closeModal();
  toast('✅ ' + c.empresa + ' actualitzat!');
}

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeModal();
});

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast-msg';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ═══ INIT ═══
renderMarkers();
renderList();
</script>
